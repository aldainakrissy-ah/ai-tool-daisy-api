spring.ai.openai.api-key=${OPEN_API_KEY}
spring.server.port=8080
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Questionnaire Engine Configuration
questionnaire.auto-load-on-startup=${LOAD_QUESTIONNAIRES_ON_STARTUP}
questionnaire.default-language=nl
questionnaire.supported-languages=en,nl

# JSON configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false