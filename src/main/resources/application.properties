spring.ai.openai.api-key=${OPEN_API_KEY}
spring.server.port=8080
api.key=${API_KEY}

#File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

spring.datasource.jdbc-url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP pool size for this datasource is set in code (PrimaryDBConfig) -
# these properties don't bind because the bean uses a custom @ConfigurationProperties prefix.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Questionnaire Engine Configuration
questionnaire.auto-load-on-startup=${LOAD_QUESTIONNAIRES_ON_STARTUP}
questionnaire.default-language=nl
questionnaire.supported-languages=en,nl

# JSON configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# Second Database Configuration (conditional)
second.database.enabled=${SECOND_DATABASE_ENABLED:true}

# Second Datasource Configuration
spring.second-datasource.jdbc-url=${SECOND_DB_URL:jdbc:postgresql://37.128.150.250:5432/biocoherence_web_production?ssl=true&sslmode=prefer&connectTimeout=30&socketTimeout=60}
spring.second-datasource.username=${SECOND_DB_USER}
spring.second-datasource.password=${SECOND_DB_PASS}
spring.second-datasource.driver-class-name=org.postgresql.Driver
# HikariCP pool size for this datasource is set in code (SecondDBConfig) -
# these properties don't bind because the bean uses a custom @ConfigurationProperties prefix.


# SSH Tunnel Configuration for Second Datasource
ssh.enabled=${SSH_ENABLED:false}
ssh.host=${SSH_HOST}
ssh.port=${SSH_PORT:22}
ssh.user=${SSH_USER}
ssh.password=${SSH_PASS}
ssh.remote.host=${SECOND_DB_REMOTE_HOST:localhost}
ssh.remote.port=${SECOND_DB_REMOTE_PORT:5432}
ssh.local.port=${SECOND_DB_LOCAL_PORT:5433}

# OpenAI API Configuration
openai.vector-store-id=${OPENAI_VECTOR_STORE_ID}
openai.summary-report.prompt-id=${OPENAI_SUMMARY_REPORT_PROMPT_ID}
openai.summary-report.prompt-version=${OPENAI_SUMMARY_REPORT_PROMPT_VERSION}
openai.questionnaire-analysis.prompt-id=${OPENAI_QUESTIONNAIRE_ANALYSIS_PROMPT_ID}
openai.questionnaire-analysis.prompt-version=${OPENAI_QUESTIONNAIRE_ANALYSIS_PROMPT_VERSION}

# Prompt 1 dedicated credentials
openai.prompt1.prompt-id=${OPENAI_PROMPT1_ID}
openai.prompt1.prompt-version=${OPENAI_PROMPT1_VERSION}

# Prompt 2 dedicated credentials
openai.prompt2.prompt-id=${OPENAI_PROMPT2_ID}
openai.prompt2.prompt-version=${OPENAI_PROMPT2_VERSION}
