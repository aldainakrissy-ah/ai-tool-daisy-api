spring.ai.openai.api-key=${OPEN_API_KEY}
spring.server.port=8080
api.key=${API_KEY}

#File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

spring.datasource.jdbc-url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP connection pool settings to prevent connection exhaustion
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Questionnaire Engine Configuration
questionnaire.auto-load-on-startup=${LOAD_QUESTIONNAIRES_ON_STARTUP}
questionnaire.default-language=nl
questionnaire.supported-languages=en,nl

# JSON configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# Second Database Configuration (conditional)
second.database.enabled=${SECOND_DATABASE_ENABLED:true}

# Second Datasource Configuration
spring.second-datasource.jdbc-url=${SECOND_DB_URL:jdbc:postgresql://37.128.150.250:5432/biocoherence_web_production?ssl=true&sslmode=prefer&connectTimeout=30&socketTimeout=60}
spring.second-datasource.username=${SECOND_DB_USER}
spring.second-datasource.password=${SECOND_DB_PASS}
spring.second-datasource.driver-class-name=org.postgresql.Driver
# HikariCP connection pool settings to prevent connection exhaustion
spring.second-datasource.hikari.maximum-pool-size=5
spring.second-datasource.hikari.idle-timeout=30000


# SSH Tunnel Configuration for Second Datasource
ssh.enabled=${SSH_ENABLED:false}
ssh.host=${SSH_HOST}
ssh.port=${SSH_PORT:22}
ssh.user=${SSH_USER}
ssh.password=${SSH_PASS}
ssh.remote.host=${SECOND_DB_REMOTE_HOST:localhost}
ssh.remote.port=${SECOND_DB_REMOTE_PORT:5432}
ssh.local.port=${SECOND_DB_LOCAL_PORT:5433}

# OpenAI API Configuration
openai.vector-store-id=${OPENAI_VECTOR_STORE_ID}
# Model used only if the model on the stored prompt returns 404 (retired / no access)
openai.fallback-model=${OPENAI_FALLBACK_MODEL:gpt-5}
openai.summary-report.prompt-id=${OPENAI_SUMMARY_REPORT_PROMPT_ID}
openai.summary-report.prompt-version=${OPENAI_SUMMARY_REPORT_PROMPT_VERSION}
openai.questionnaire-analysis.prompt-id=${OPENAI_QUESTIONNAIRE_ANALYSIS_PROMPT_ID}
openai.questionnaire-analysis.prompt-version=${OPENAI_QUESTIONNAIRE_ANALYSIS_PROMPT_VERSION}

# Prompt 1 dedicated credentials
openai.prompt1.prompt-id=${OPENAI_PROMPT1_ID}
openai.prompt1.prompt-version=${OPENAI_PROMPT1_VERSION}

# Prompt 2 dedicated credentials
openai.prompt2.prompt-id=${OPENAI_PROMPT2_ID}
openai.prompt2.prompt-version=${OPENAI_PROMPT2_VERSION}

# Prompt 1 knowledge tables: Docling chunk build (chunks.jsonl) holding the reference documents
knowledge.source.chunks-file=${KNOWLEDGE_CHUNKS_FILE:}
# Prompt 1 knowledge tables: directory with the original reference documents (.md); used instead of the chunks file when set
knowledge.source.markdown-dir=${KNOWLEDGE_MARKDOWN_DIR:}

# Prompt 1 experiment runs on Jan's turn-based route (POST /api/v1/ai-tool-daisy/experiments/prompt1/runs);
# the two-call route and its settings were retired on 13 Nov 2026. Model (when no preset or per-turn model is set),
# output limit and timeout per call
experiment.prompt1.model=${PROMPT1_EXPERIMENT_MODEL:gpt-5.6-luna}
experiment.prompt1.max-output-tokens=${PROMPT1_EXPERIMENT_MAX_OUTPUT_TOKENS:64000}
experiment.prompt1.request-timeout-minutes=${PROMPT1_EXPERIMENT_TIMEOUT_MINUTES:30}
# Pinned document versions, e.g. 07:v8; empty = active (highest) versions
experiment.prompt1.document-versions=${PROMPT1_DOCUMENT_VERSIONS:}
# Prompt-cache routing key prefix (the turn is appended)
experiment.prompt1.cache-key=${PROMPT1_CACHE_KEY:daisy-prompt1}
# Prices in USD per million tokens, used for a model without its own entry in experiment.prompt1.turns.prices (defaults: gpt-5.6-luna)
experiment.prompt1.price.input-per-million=${PROMPT1_PRICE_INPUT:0.20}
experiment.prompt1.price.cached-input-per-million=${PROMPT1_PRICE_CACHED_INPUT:0.02}
experiment.prompt1.price.cache-write-per-million=${PROMPT1_PRICE_CACHE_WRITE:0.25}
experiment.prompt1.price.output-per-million=${PROMPT1_PRICE_OUTPUT:1.20}
# Background runs (POST /api/v1/ai-tool-daisy/experiments/prompt1/runs): parallel runs and queue size
# Turn-based route (Jan's PRELOAD design): its files (turn configuration, system message, doc 18, schema, B2 matrix)
# come from the ACTIVE P1 release of the release store (/api/v1/ai-tool-daisy/releases). The file paths below are only
# a local fallback when no release is active; never set them on a server (Jan's files must not be in an image).
# Also: effort per turn (A1, A2, A3, B, C, D, rest), C turns at the same time, tries per turn (first answer + corrections)
experiment.prompt1.turns.config=${PROMPT1_TURNS_CONFIG:}
experiment.prompt1.turns.system-message-file=${PROMPT1_TURNS_SM_FILE:}
experiment.prompt1.turns.doc18-file=${PROMPT1_TURNS_DOC18_FILE:}
experiment.prompt1.turns.schema-file=${PROMPT1_TURNS_SCHEMA_FILE:}
experiment.prompt1.turns.effort=${PROMPT1_TURNS_EFFORT:A1=high,A2=high,rest=medium}
experiment.prompt1.turns.c-concurrency=${PROMPT1_TURNS_C_CONCURRENCY:5}
experiment.prompt1.turns.max-tries=${PROMPT1_TURNS_MAX_TRIES:3}
# Jan's B2 mapping matrix of doc 07 v9 (07_B2_matrix.tsv, v06): turn D has no model call, B2 comes from this file
experiment.prompt1.turns.b2-matrix-file=${PROMPT1_TURNS_B2_MATRIX_FILE:}
# Model calls in OpenAI background mode with polling (Jan v05b): a sign of life every minute, cancelled after max-minutes
experiment.prompt1.turns.background=${PROMPT1_TURNS_BACKGROUND:true}
experiment.prompt1.turns.poll-seconds=${PROMPT1_TURNS_POLL_SECONDS:15}
experiment.prompt1.turns.max-minutes=${PROMPT1_TURNS_MAX_MINUTES:45}
# Stored run files (working files, prompts, answers): deleted this many days after a run ended (0 = keep), daily at the cron time;
# store-prompts=false keeps the working files and answers but not the full prompt texts (about two thirds of the storage)
prompt1.run-files.retention-days=${PROMPT1_RUN_FILES_RETENTION_DAYS:30}
prompt1.run-files.cleanup-cron=${PROMPT1_RUN_FILES_CLEANUP_CRON:0 30 3 * * *}
prompt1.run-files.store-prompts=${PROMPT1_RUN_FILES_STORE_PROMPTS:true}
# Model per turn (empty = experiment.prompt1.model for every turn), e.g. A1=gpt-6.1-terra,A2=gpt-6.1-terra,rest=gpt-6-luna
experiment.prompt1.turns.model=${PROMPT1_TURNS_MODEL:}
# Named model-and-effort plan: quality, standard or economy (empty = the model and effort settings); a run can also ask for one with ?preset=
experiment.prompt1.turns.preset=${PROMPT1_TURNS_PRESET:}
# USD per 1M tokens per model (input/cached/cache-write/output), for the cost per turn
experiment.prompt1.turns.prices=${PROMPT1_TURNS_PRICES:gpt-6.1-terra=1.00/0.05/1.25/5.00,gpt-6.1-sol=2.00/0.10/2.50/10.00,gpt-6-luna=0.10/0.01/0.125/0.50,gpt-5.6-luna=0.20/0.02/0.25/1.20}
experiment.prompt1.runs.concurrency=${PROMPT1_RUNS_CONCURRENCY:2}
experiment.prompt1.runs.queue-capacity=${PROMPT1_RUNS_QUEUE_CAPACITY:50}
